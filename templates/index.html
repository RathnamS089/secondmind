<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecondMind - Your second brain. Runs locally.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Custom scrollbar to match minimal aesthetic */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        
        /* Markdown prose styling overrides */
        .prose pre { background-color: #f9fafb; border: 1px solid #e5e7eb; color: #374151; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.8125rem; }
        .prose code { background-color: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.8125rem; }
        .prose p { margin-bottom: 0.75em; }
        .prose p:last-child { margin-bottom: 0; }
        .prose ul { list-style-type: disc; padding-left: 1.25em; margin-bottom: 0.75em; }
        .prose ol { list-style-type: decimal; padding-left: 1.25em; margin-bottom: 0.75em; }
        
        /* Loading dot animation */
        .dot-flashing {
            position: relative; width: 6px; height: 6px; border-radius: 3px; background-color: #9ca3af; color: #9ca3af;
            animation: dot-flashing 1s infinite linear alternate; animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ''; display: inline-block; position: absolute; top: 0;
            width: 6px; height: 6px; border-radius: 3px; background-color: #9ca3af; color: #9ca3af;
            animation: dot-flashing 1s infinite alternate;
        }
        .dot-flashing::before { left: -10px; animation-delay: 0s; }
        .dot-flashing::after { left: 10px; animation-delay: 1s; }
        @keyframes dot-flashing { 0% { background-color: #9ca3af; } 50%, 100% { background-color: #e5e7eb; } }

        /* Tools dropdown animation */
        @keyframes tools-pop { from { opacity: 0; transform: translateY(4px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .tools-menu-anim { animation: tools-pop 120ms ease-out; }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen flex overflow-hidden selection:bg-gray-200">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-gray-50 border-r border-gray-100 flex flex-col justify-between hidden md:flex shrink-0">
        <div class="p-4">
            <div class="font-semibold text-lg mb-6 text-gray-900 tracking-tight">SecondMind</div>
            
            <button id="btn-new-chat" class="w-full flex items-center gap-2 px-3 py-2 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 text-sm font-medium transition-colors mb-6 text-gray-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Chat
            </button>

            <nav class="space-y-1">
                <button id="nav-chat" class="w-full flex items-center gap-2 px-3 py-2 rounded-md bg-gray-200 text-gray-900 text-sm font-medium transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    Chats
                </button>
                <button id="nav-memories" class="w-full flex items-center gap-2 px-3 py-2 rounded-md hover:bg-gray-100 text-gray-600 text-sm font-medium transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Memories
                </button>
                <button id="nav-settings" class="w-full flex items-center gap-2 px-3 py-2 rounded-md hover:bg-gray-100 text-gray-600 text-sm font-medium transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </nav>
        </div>
        <div class="p-4 space-y-1">
            <div class="flex items-center gap-2 text-[11px] text-gray-500 uppercase tracking-wider font-semibold">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500"></div> Local
            </div>
            <div class="text-xs text-gray-700">Qwen 2.5 1.5B</div>
            <div class="text-[10px] text-gray-400">Powered by Ollama</div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative w-full h-full">
        <!-- Header (Mobile menu & model selector) -->
        <header class="h-12 flex items-center justify-between md:justify-center px-4 shrink-0">
            <button class="md:hidden text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="text-sm font-medium text-gray-500 flex items-center gap-1 cursor-default hover:text-gray-700 transition-colors">
                Qwen 2.5 1.5B
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            <div class="w-5 md:hidden"></div>
        </header>

        <!-- View: Chat -->
        <div id="view-chat" class="flex-1 flex flex-col overflow-hidden relative w-full">
            <!-- Messages Stream -->
            <div id="chat-messages" class="flex-1 overflow-y-auto px-4 pb-36 pt-4 w-full">
                <div class="max-w-3xl mx-auto flex flex-col space-y-8" id="chat-content">
                    <!-- Welcome State -->
                    <div id="welcome-state" class="flex flex-col items-center justify-center text-center mt-20 opacity-80">
                        <h1 class="text-3xl font-semibold text-gray-800 mb-2">SecondMind</h1>
                        <p class="text-gray-500 text-sm">Your second brain. Runs locally.</p>
                    </div>
                </div>
            </div>

            <!-- Chat Input Footer -->
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-8 pb-6 px-4">
                <div id="composer-wrap" class="max-w-3xl mx-auto relative group">

                    <!-- Toast / confirmation -->
                    <div id="tool-toast" class="hidden absolute -top-9 left-1/2 -translate-x-1/2 z-20 bg-gray-800 text-white text-xs px-3 py-1.5 rounded-full shadow-md whitespace-nowrap"></div>

                    <!-- Tool mode indicator chip -->
                    <div id="tool-mode-chip" class="hidden absolute -top-8 left-1 z-10 items-center gap-1.5 text-[12px] font-medium text-gray-600 bg-gray-100 border border-gray-200 rounded-full px-2.5 py-1 shadow-sm">
                        <span id="tool-mode-label"></span>
                        <button id="btn-tool-clear" type="button" aria-label="Exit tool mode" title="Exit tool mode"
                                class="text-gray-400 hover:text-gray-700 transition-colors leading-none p-0.5 -mr-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- ===== Normal chat composer ===== -->
                    <div id="composer-normal">
                        <textarea id="chat-input" rows="1" class="w-full bg-gray-50 border border-gray-200 rounded-3xl pl-5 pr-14 py-3.5 focus:outline-none focus:border-gray-300 focus:bg-white resize-none max-h-48 text-gray-800 text-[15px] placeholder-gray-400 leading-relaxed shadow-sm transition-all" placeholder="Ask SecondMind anything..."></textarea>

                        <!-- Tools dropdown trigger -->
                        <div class="absolute left-2.5 bottom-2">
                            <button id="btn-tools" type="button" aria-haspopup="true" aria-expanded="false"
                                    class="flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[13px] font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100 transition-colors select-none">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                Tools
                                <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>

                            <!-- Tools popover -->
                            <div id="tools-menu" class="hidden tools-menu-anim absolute bottom-full mb-2 left-0 w-56 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-30">
                                <div class="px-3 pt-1.5 pb-2 text-[11px] font-semibold uppercase tracking-wider text-gray-400">Tools</div>
                                <button type="button" class="tool-option w-full flex items-center gap-2.5 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors text-left" data-tool="remember">
                                    <span class="w-5 text-center shrink-0">🧠</span> Remember
                                </button>
                                <button type="button" class="tool-option w-full flex items-center gap-2.5 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors text-left" data-tool="recall">
                                    <span class="w-5 text-center shrink-0">🔎</span> Recall
                                </button>
                                <button type="button" class="tool-option w-full flex items-center gap-2.5 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors text-left" data-tool="forget">
                                    <span class="w-5 text-center shrink-0">🗑</span> Forget
                                </button>
                            </div>
                        </div>

                        <button id="btn-send" type="button" aria-label="Send" class="absolute right-2.5 bottom-2.5 p-2 rounded-full bg-gray-800 text-white hover:bg-gray-700 disabled:bg-gray-200 disabled:text-gray-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>

                    <!-- ===== Remember mode ===== -->
                    <div id="composer-remember" class="hidden bg-white border border-gray-200 rounded-3xl shadow-sm p-4 space-y-3">
                        <label for="remember-input" class="block text-[13px] font-medium text-gray-500">What should I remember?</label>
                        <textarea id="remember-input" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-gray-300 focus:bg-white resize-none text-[15px] text-gray-800 placeholder-gray-400 leading-relaxed transition-all" placeholder="e.g. I prefer studying DSA at night."></textarea>
                        <div class="flex items-center justify-between gap-3 flex-wrap">
                            <div class="flex items-center gap-2 text-sm text-gray-500">
                                <label for="remember-category" class="text-[13px]">Category:</label>
                                <select id="remember-category" class="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-[13px] text-gray-700 focus:outline-none focus:border-gray-300 cursor-pointer">
                                    <option>General</option>
                                    <option>Personal</option>
                                    <option>Preference</option>
                                    <option selected>Study</option>
                                    <option>Projects</option>
                                    <option>Work</option>
                                </select>
                            </div>
                            <button id="btn-remember-save" type="button" class="px-4 py-2 rounded-full bg-gray-800 text-white text-sm font-medium hover:bg-gray-700 disabled:bg-gray-200 disabled:text-gray-400 transition-colors shrink-0">Save Memory</button>
                        </div>
                    </div>

                    <!-- ===== Recall mode ===== -->
                    <div id="composer-recall" class="hidden bg-white border border-gray-200 rounded-3xl shadow-sm p-4">
                        <div class="flex items-center gap-2">
                            <input type="text" id="recall-input" class="flex-1 bg-transparent text-[15px] text-gray-800 placeholder-gray-400 focus:outline-none" placeholder="Search your memories..." autocomplete="off">
                            <button id="btn-recall-search" type="button" aria-label="Search memories" class="p-2 rounded-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 transition-colors shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- ===== Forget mode ===== -->
                    <div id="composer-forget" class="hidden bg-white border border-gray-200 rounded-3xl shadow-sm p-4 space-y-3">
                        <div class="text-[13px] font-medium text-gray-500">Select a memory to forget</div>
                        <div id="forget-list" class="max-h-44 overflow-y-auto space-y-1 pr-1">
                            <div class="text-sm text-gray-400 py-2">Loading memories...</div>
                        </div>
                        <div class="flex justify-end">
                            <button id="btn-forget-confirm" type="button" disabled class="px-4 py-2 rounded-full bg-red-600 text-white text-sm font-medium hover:bg-red-700 disabled:bg-gray-200 disabled:text-gray-400 transition-colors shrink-0">Forget Memory</button>
                        </div>
                    </div>

                </div>
                <div class="max-w-3xl mx-auto text-center mt-2">
                    <span class="text-[10px] text-gray-400">Shift + Enter for new line. AI can make mistakes.</span>
                </div>
            </div>
        </div>

        <!-- View: Memories -->
        <div id="view-memories" class="hidden flex-1 overflow-hidden w-full">
            <div class="max-w-3xl mx-auto w-full h-full flex flex-col px-4 pt-4 pb-10">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Memories</h2>
                
                <div class="relative mb-8">
                    <svg class="w-4 h-4 absolute left-0 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="memory-search" placeholder="Search memories..." class="w-full border-b border-gray-200 py-2 pl-7 pr-4 focus:outline-none focus:border-gray-800 text-sm text-gray-800 bg-transparent transition-colors">
                </div>
                
                <div id="memories-list" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Populated via JS -->
                    <div class="text-sm text-gray-500 text-center mt-10">Loading memories...</div>
                </div>
            </div>
        </div>

        <!-- View: Settings (Placeholder) -->
        <div id="view-settings" class="hidden flex-1 overflow-hidden w-full">
            <div class="max-w-3xl mx-auto w-full h-full flex flex-col px-4 pt-4 pb-10">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Settings</h2>
                <p class="text-sm text-gray-500">Settings implementation goes here.</p>
            </div>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- CSRF helpers: Django requires the token for POST/DELETE.
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }
        async function csrfFetch(url, options) {
            options = options || {};
            const headers = Object.assign({}, options.headers);
            if (options.method && options.method.toUpperCase() !== 'GET') {
                const token = getCookie('csrftoken');
                if (token) headers['X-CSRFToken'] = token;
            }
            return fetch(url, Object.assign({}, options, { headers: headers }));
        }

        // Elements
        const navChat = document.getElementById('nav-chat');
        const navMemories = document.getElementById('nav-memories');
        const navSettings = document.getElementById('nav-settings');
        const btnNewChat = document.getElementById('btn-new-chat');
        
        const viewChat = document.getElementById('view-chat');
        const viewMemories = document.getElementById('view-memories');
        const viewSettings = document.getElementById('view-settings');
        
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const chatContent = document.getElementById('chat-content');
        const welcomeState = document.getElementById('welcome-state');
        const chatMessages = document.getElementById('chat-messages');
        
        const memoriesList = document.getElementById('memories-list');
        const memorySearch = document.getElementById('memory-search');
        
        let allMemories = [];

        // --- Navigation ---
        function switchView(viewId) {
            viewChat.classList.add('hidden');
            viewMemories.classList.add('hidden');
            viewSettings.classList.add('hidden');
            
            navChat.classList.remove('bg-gray-200', 'text-gray-900');
            navChat.classList.add('hover:bg-gray-100', 'text-gray-600');
            navMemories.classList.remove('bg-gray-200', 'text-gray-900');
            navMemories.classList.add('hover:bg-gray-100', 'text-gray-600');
            navSettings.classList.remove('bg-gray-200', 'text-gray-900');
            navSettings.classList.add('hover:bg-gray-100', 'text-gray-600');
            
            document.getElementById(viewId).classList.remove('hidden');
            
            if(viewId === 'view-chat') {
                navChat.classList.add('bg-gray-200', 'text-gray-900');
                navChat.classList.remove('hover:bg-gray-100', 'text-gray-600');
                scrollToBottom();
                setTimeout(() => chatInput.focus(), 100);
            } else if (viewId === 'view-memories') {
                navMemories.classList.add('bg-gray-200', 'text-gray-900');
                navMemories.classList.remove('hover:bg-gray-100', 'text-gray-600');
                fetchMemories();
            } else if (viewId === 'view-settings') {
                navSettings.classList.add('bg-gray-200', 'text-gray-900');
                navSettings.classList.remove('hover:bg-gray-100', 'text-gray-600');
            }
        }

        navChat.addEventListener('click', () => switchView('view-chat'));
        navMemories.addEventListener('click', () => switchView('view-memories'));
        navSettings.addEventListener('click', () => switchView('view-settings'));
        
        btnNewChat.addEventListener('click', () => {
            chatContent.innerHTML = '';
            chatContent.appendChild(welcomeState);
            welcomeState.style.display = 'flex';
            switchView('view-chat');
        });

        // --- Textarea auto-resize ---
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') {
                btnSend.disabled = true;
            } else {
                btnSend.disabled = false;
            }
        });
        btnSend.disabled = true;

        // --- Chat Submission ---
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        btnSend.addEventListener('click', sendMessage);

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            // Reset input
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;
            
            // Hide welcome
            if (welcomeState.style.display !== 'none') {
                welcomeState.style.display = 'none';
            }

            // Append User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'flex justify-end w-full';
            userDiv.innerHTML = `
                <div class="bg-gray-100 text-gray-800 rounded-3xl px-5 py-2.5 max-w-[85%] text-[15px] whitespace-pre-wrap leading-relaxed shadow-sm">
                    ${escapeHTML(text)}
                </div>
            `;
            chatContent.appendChild(userDiv);
            scrollToBottom();

            // Append Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start w-full';
            loadingDiv.innerHTML = `
                <div class="text-gray-800 w-full text-[15px] max-w-none pt-2">
                    <div class="dot-flashing ml-4 mt-2"></div>
                </div>
            `;
            chatContent.appendChild(loadingDiv);
            scrollToBottom();

            // Fetch backend
            try {
                const res = await csrfFetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await res.json();
                
                // Remove loading
                loadingDiv.remove();

                // Append Assistant Message
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'flex justify-start w-full';
                
                let memoriesHtml = '';
                if (data.memories_used && data.memories_used.length > 0) {
                    const memItems = data.memories_used.map(m => `<div class="py-1 line-clamp-1 truncate hover:line-clamp-none hover:whitespace-normal transition-all">• ${escapeHTML(m)}</div>`).join('');
                    memoriesHtml = `
                        <div class="mt-3">
                            <details class="text-[13px] text-gray-500 group">
                                <summary class="cursor-pointer select-none hover:text-gray-700 flex items-center gap-1.5 transition-colors">
                                    <svg class="w-3.5 h-3.5 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    ${data.memories_used.length} ${data.memories_used.length === 1 ? 'memory' : 'memories'} used
                                </summary>
                                <div class="mt-2 pl-5 border-l-2 border-gray-100 space-y-0.5 text-gray-400">
                                    ${memItems}
                                </div>
                            </details>
                        </div>
                    `;
                }
                
                if (data.error) {
                    assistantDiv.innerHTML = `<div class="text-red-500 text-[15px] pt-1">Error: ${escapeHTML(data.error)}</div>`;
                } else {
                    const parsedMarkdown = marked.parse(data.response || '');
                    let toolHtml = '';
                    if (data.tool_called) {
                         toolHtml = `<div class="mt-2 text-xs font-mono text-gray-400 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Agent action: ${escapeHTML(data.tool_called)}</div>`;
                    }
                    
                    assistantDiv.innerHTML = `
                        <div class="text-gray-800 w-full text-[15px] leading-relaxed prose prose-sm max-w-none pt-1">
                            ${parsedMarkdown}
                            ${memoriesHtml}
                            ${toolHtml}
                        </div>
                    `;
                }
                
                chatContent.appendChild(assistantDiv);
                scrollToBottom();

            } catch (err) {
                loadingDiv.remove();
                const errDiv = document.createElement('div');
                errDiv.className = 'flex justify-start w-full';
                errDiv.innerHTML = `<div class="text-red-500 text-[15px] pt-1">Request failed: ${escapeHTML(err.message || err.toString())}</div>`;
                chatContent.appendChild(errDiv);
                scrollToBottom();
            }
        }

        // --- Memories List ---
        async function fetchMemories() {
            memoriesList.innerHTML = '<div class="text-sm text-gray-500 mt-10">Loading memories...</div>';
            try {
                const res = await fetch('/api/memories/');
                const data = await res.json();
                allMemories = data.memories || [];
                renderMemories(allMemories);
            } catch (e) {
                memoriesList.innerHTML = '<div class="text-sm text-red-500 mt-10">Failed to load memories.</div>';
            }
        }

        function renderMemories(memories) {
            memoriesList.innerHTML = '';
            if (memories.length === 0) {
                memoriesList.innerHTML = '<div class="text-sm text-gray-400 mt-10">No memories found.</div>';
                return;
            }
            
            memories.forEach(mem => {
                const el = document.createElement('div');
                el.className = "py-4 border-b border-gray-100 flex justify-between items-start group hover:bg-gray-50 px-2 -mx-2 rounded transition-colors";
                el.innerHTML = `
                    <div class="pr-4">
                        <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1">${escapeHTML(mem.category)}</div>
                        <div class="text-[14px] text-gray-800 leading-relaxed">${escapeHTML(mem.content)}</div>
                    </div>
                    <button onclick="deleteMemory(${mem.id})" class="text-xs text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity shrink-0 pt-1">Delete</button>
                `;
                memoriesList.appendChild(el);
            });
        }

        memorySearch.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allMemories.filter(m => 
                m.content.toLowerCase().includes(q) || 
                m.category.toLowerCase().includes(q)
            );
            renderMemories(filtered);
        });

        window.deleteMemory = async function(id) {
            if (!confirm('Are you sure you want to forget this?')) return;
            try {
                await csrfFetch(`/api/memories/${id}/`, { method: 'DELETE' });
                allMemories = allMemories.filter(m => m.id !== id);
                renderMemories(allMemories);
            } catch (e) {
                console.error(e);
            }
        }

        // ============================================================
        // --- Tools dropdown & tool modes (Remember / Recall / Forget)
        // These call the SAME Django endpoints that route through
        // memory/tools.py (remember / recall / forget) — one source
        // of truth shared with the AI agent. No embedding or
        // similarity logic lives in JavaScript.
        // ============================================================
        const composerWrap = document.getElementById('composer-wrap');
        const composerNormal = document.getElementById('composer-normal');
        const composerRemember = document.getElementById('composer-remember');
        const composerRecall = document.getElementById('composer-recall');
        const composerForget = document.getElementById('composer-forget');
        const btnTools = document.getElementById('btn-tools');
        const toolsMenu = document.getElementById('tools-menu');
        const toolModeChip = document.getElementById('tool-mode-chip');
        const toolModeLabel = document.getElementById('tool-mode-label');
        const btnToolClear = document.getElementById('btn-tool-clear');
        const toolToast = document.getElementById('tool-toast');

        const rememberInput = document.getElementById('remember-input');
        const rememberCategory = document.getElementById('remember-category');
        const btnRememberSave = document.getElementById('btn-remember-save');
        const recallInput = document.getElementById('recall-input');
        const btnRecallSearch = document.getElementById('btn-recall-search');
        const forgetList = document.getElementById('forget-list');
        const btnForgetConfirm = document.getElementById('btn-forget-confirm');

        const TOOL_META = {
            remember: { label: '\u{1F9E0} Remember', placeholder: 'What should SecondMind remember?' },
            recall:   { label: '\u{1F50E} Recall',     placeholder: 'Search your memories...' },
            forget:   { label: '\u{1F5D1} Forget',     placeholder: 'Select a memory to forget' },
        };

        let activeTool = null;      // null | 'remember' | 'recall' | 'forget'
        let selectedForgetId = null;
        let toastTimer = null;

        function showToast(message, isError) {
            clearTimeout(toastTimer);
            toolToast.textContent = message;
            toolToast.className = toolToast.className
                .replace(/bg-(gray-800|red-600)/, isError ? 'bg-red-600' : 'bg-gray-800');
            toolToast.classList.remove('hidden');
            toastTimer = setTimeout(() => toolToast.classList.add('hidden'), 2600);
        }

        // ----- Dropdown open/close -----
        function openToolsMenu() {
            toolsMenu.classList.remove('hidden');
            btnTools.setAttribute('aria-expanded', 'true');
        }
        function closeToolsMenu() {
            toolsMenu.classList.add('hidden');
            btnTools.setAttribute('aria-expanded', 'false');
        }
        btnTools.addEventListener('click', (e) => {
            e.stopPropagation();
            if (toolsMenu.classList.contains('hidden')) openToolsMenu();
            else closeToolsMenu();
        });

        // Close on click outside.
        document.addEventListener('click', (e) => {
            if (!toolsMenu.classList.contains('hidden') && !toolsMenu.contains(e.target)) {
                closeToolsMenu();
            }
        });

        // Close on Escape (and exit tool mode when the menu isn't open).
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!toolsMenu.classList.contains('hidden')) {
                closeToolsMenu();
            } else if (activeTool) {
                setToolMode(null);
            }
        });

        // Selecting a tool closes the menu and switches the composer.
        document.querySelectorAll('.tool-option').forEach(btn => {
            btn.addEventListener('click', () => {
                closeToolsMenu();
                setToolMode(btn.dataset.tool);
            });
        });

        btnToolClear.addEventListener('click', () => setToolMode(null));

        // ----- Tool mode switching -----
        function setToolMode(tool) {
            activeTool = tool;
            closeToolsMenu();
            composerNormal.classList.toggle('hidden', !!tool);
            composerRemember.classList.toggle('hidden', tool !== 'remember');
            composerRecall.classList.toggle('hidden', tool !== 'recall');
            composerForget.classList.toggle('hidden', tool !== 'forget');

            if (tool) {
                toolModeLabel.textContent = TOOL_META[tool].label;
                toolModeChip.classList.remove('hidden');
                toolModeChip.classList.add('flex');
                if (tool === 'remember') {
                    rememberInput.focus();
                } else if (tool === 'recall') {
                    recallInput.value = '';
                    recallInput.placeholder = TOOL_META.recall.placeholder;
                    recallInput.focus();
                } else if (tool === 'forget') {
                    selectedForgetId = null;
                    btnForgetConfirm.disabled = true;
                    loadMemoriesForForget();
                }
            } else {
                toolModeChip.classList.add('hidden');
                toolModeChip.classList.remove('flex');
                rememberInput.value = '';
                recallInput.value = '';
                if (viewChat.classList.contains('hidden') === false) {
                    chatInput.focus();
                }
            }
        }

        // ----- Helper: silently refresh the shared memories cache -----
        async function refreshMemoriesCache() {
            try {
                const res = await fetch('/api/memories/');
                const data = await res.json();
                allMemories = data.memories || [];
            } catch (e) { /* keep previous cache */ }
        }

        // ----- REMEMBER: POST /api/memories/ -> views.memories -> tools.remember() -----
        async function saveMemoryFromUI() {
            const content = rememberInput.value.trim();
            if (!content) { rememberInput.focus(); return; }

            btnRememberSave.disabled = true;
            btnRememberSave.textContent = 'Saving...';
            try {
                const res = await csrfFetch('/api/memories/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, category: rememberCategory.value })
                });
                const data = await res.json();
                if (!res.ok || data.error) throw new Error(data.error || 'Request failed');

                // Persisted server-side (Ollama embed -> SQLite). Update UI.
                await refreshMemoriesCache();
                if (!viewMemories.classList.contains('hidden')) renderMemories(allMemories);

                setToolMode(null);
                showToast('\u2713 Memory saved');
            } catch (err) {
                showToast('Could not save memory: ' + (err.message || err), true);
            } finally {
                btnRememberSave.disabled = false;
                btnRememberSave.textContent = 'Save Memory';
            }
        }
        btnRememberSave.addEventListener('click', saveMemoryFromUI);
        rememberInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveMemoryFromUI(); }
        });

        // ----- RECALL: POST /api/recall/ -> views.recall_view -> tools.recall() -----
        async function searchMemoriesFromUI() {
            const query = recallInput.value.trim();
            if (!query) { recallInput.focus(); return; }

            btnRecallSearch.disabled = true;
            try {
                const res = await csrfFetch('/api/recall/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                if (!res.ok || data.error) throw new Error(data.error || 'Request failed');

                appendRecallResults(query, data.results || []);
                setToolMode(null);
            } catch (err) {
                showToast('Recall failed: ' + (err.message || err), true);
            } finally {
                btnRecallSearch.disabled = false;
            }
        }
        btnRecallSearch.addEventListener('click', searchMemoriesFromUI);
        recallInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); searchMemoriesFromUI(); }
        });

        function appendRecallResults(query, results) {
            if (welcomeState.style.display !== 'none') welcomeState.style.display = 'none';

            const userDiv = document.createElement('div');
            userDiv.className = 'flex justify-end w-full';
            userDiv.innerHTML = `
                <div class="bg-gray-100 text-gray-800 rounded-3xl px-5 py-2.5 max-w-[85%] text-[15px] whitespace-pre-wrap leading-relaxed shadow-sm">
                    <span class="text-gray-400 text-xs font-medium mr-1">\u{1F50E}</span>${escapeHTML(query)}
                </div>
            `;
            chatContent.appendChild(userDiv);

            const rows = results.map(r => `
                <div class="py-2 border-b border-gray-100 last:border-0">
                    <div class="flex items-baseline gap-3">
                        <span class="font-mono text-xs text-gray-500 shrink-0">${r.score.toFixed(2)}</span>
                        <span class="text-[14px] text-gray-800 leading-relaxed">${escapeHTML(r.content)}</span>
                    </div>
                    <div class="pl-[2.35rem] text-[11px] font-semibold text-gray-400 uppercase tracking-wider mt-0.5">${escapeHTML(r.category)}</div>
                </div>
            `).join('');

            const bodyHtml = results.length > 0
                ? `<div class="mt-2 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2 max-w-full">${rows}</div>`
                : `<div class="mt-2 text-sm text-gray-400">No matching memories found.</div>`;

            const div = document.createElement('div');
            div.className = 'flex justify-start w-full';
            div.innerHTML = `
                <div class="w-full text-[15px] pt-1">
                    <div class="text-[13px] font-semibold text-gray-500">Recall results</div>
                    ${bodyHtml}
                </div>
            `;
            chatContent.appendChild(div);
            scrollToBottom();
        }

        // ----- FORGET: DELETE /api/memories/<id>/ -> views.memory_delete -> tools.forget path -----
        async function loadMemoriesForForget() {
            forgetList.innerHTML = '<div class="text-sm text-gray-400 py-2">Loading memories...</div>';
            await refreshMemoriesCache();
            renderForgetOptions();
        }

        function renderForgetOptions() {
            forgetList.innerHTML = '';
            if (allMemories.length === 0) {
                forgetList.innerHTML = '<div class="text-sm text-gray-400 py-2">No memories stored yet.</div>';
                btnForgetConfirm.disabled = true;
                return;
            }
            allMemories.forEach(mem => {
                const label = document.createElement('label');
                label.className = 'flex items-start gap-2.5 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors';
                const safeContent = escapeHTML(mem.content);
                const safeCat = escapeHTML(mem.category);
                label.innerHTML = `
                    <input type="radio" name="forget-select" value="${mem.id}" class="mt-1 accent-gray-800 cursor-pointer shrink-0">
                    <span class="min-w-0">
                        <span class="block text-sm text-gray-800 leading-snug truncate">${safeContent}</span>
                        <span class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider">${safeCat}</span>
                    </span>
                `;
                label.querySelector('input').addEventListener('change', (e) => {
                    selectedForgetId = Number(e.target.value);
                    btnForgetConfirm.disabled = false;
                });
                forgetList.appendChild(label);
            });
        }

        btnForgetConfirm.addEventListener('click', async () => {
            if (selectedForgetId === null) return;
            const id = selectedForgetId;
            btnForgetConfirm.disabled = true;
            btnForgetConfirm.textContent = 'Forgetting...';
            try {
                const res = await csrfFetch(`/api/memories/${id}/`, { method: 'DELETE' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.error) throw new Error(data.error || 'Request failed');

                allMemories = allMemories.filter(m => m.id !== id);
                selectedForgetId = null;
                renderForgetOptions();
                if (!viewMemories.classList.contains('hidden')) renderMemories(allMemories);

                setToolMode(null);
                showToast('\u2713 Memory forgotten');
            } catch (err) {
                showToast('Could not forget memory: ' + (err.message || err), true);
                btnForgetConfirm.disabled = false;
            } finally {
                btnForgetConfirm.textContent = 'Forget Memory';
            }
        });

        // Utils
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    });
    </script>
</body>
</html>
